<!doctype html>
<html lang="es-CO">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>La Cajita</title>
    <meta name="description" content="Recibe, paga y envía dinero, con o sin cuenta de banco.">
    <meta name="theme-color" content="#0B6B4F" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0F1714" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230B6B4F'/%3E%3Cpath d='M5 9l7-4 7 4v6l-7 4-7-4z M5 9l7 4 7-4 M12 13v6' fill='none' stroke='white' stroke-width='1.6' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap">
    <link rel="stylesheet" href="css/app.css">
    <script>
        // Enlaces viejos de la demo (QR impresos, /#cliente?qr=…, /#recibo?pago=…): la demo ahora vive en /demoenvivo.
        if (/^#(cliente|recibo|vendedor|remitente|celular|cajero|cobros|perfil)\b/.test(location.hash)) {
            location.replace('/demoenvivo/' + location.search + location.hash);
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" defer></script>
    <script type="module" src="js/main.js"></script>
</head>
<body>
    <a class="saltar" href="#pantalla">Saltar al contenido</a>
    <div class="marco" id="marco">
        <nav class="barra" id="barra" aria-label="Navegación principal" hidden></nav>
        <main class="contenido" id="pantalla" tabindex="-1">
            <div class="cargando-pantalla" role="status"><span class="oculto-visual">Cargando…</span></div>
        </main>
    </div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
